<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090303">
<title>Black das Blacks | Apolo Distribuidora</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090303;color:#fff;font-family:Arial,Helvetica,sans-serif}.page{min-height:100vh;display:grid;place-items:center;padding:24px}.hero{position:relative;width:min(100%,1280px);aspect-ratio:16/9;background:#100606 url('./black-das-blacks-hero.png') center/cover no-repeat;border:1px solid #64130c;box-shadow:0 0 45px #a3180c55;overflow:hidden}.timer{position:absolute;left:19%;right:19%;bottom:6.5%;min-height:20%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 14px 12px;background:linear-gradient(180deg,rgba(28,3,1,.96),rgba(8,2,2,.98));border:2px solid #ff351e;border-radius:14px;box-shadow:0 0 18px #ff321c88,inset 0 0 18px #e9211244}.timer-title{font-weight:900;font-size:clamp(12px,2.1vw,25px);letter-spacing:.04em;text-align:center;margin-bottom:5px;text-shadow:0 0 10px #ff321c}.units{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:650px}.unit{text-align:center;padding:0 5px;border-right:1px solid #f5422d66}.unit:last-child{border:0}.value{font-size:clamp(24px,5.3vw,64px);font-weight:900;line-height:.95;color:white;text-shadow:0 0 7px #ff432e,0 0 18px #ff321c}.label{font-size:clamp(8px,1vw,12px);font-weight:800;letter-spacing:.08em;margin-top:5px}.expired{font-size:clamp(18px,3vw,34px);font-weight:900;text-align:center;text-shadow:0 0 12px #ff321c}
@media(max-width:600px){.page{min-height:100svh;display:flex;align-items:flex-start;justify-content:center;padding:24px 8px}.hero{width:100%;aspect-ratio:4/3;background-size:auto 100%;background-position:center}.timer{left:8%;right:8%;bottom:5%;min-height:23%;padding:7px;border-radius:10px}.timer-title{font-size:clamp(11px,3.2vw,16px);margin-bottom:3px}.value{font-size:clamp(22px,7vw,40px)}.label{font-size:8px;margin-top:3px}}
</style>
</head>
<body>
<main class="page"><section class="hero" aria-label="Promoção Black das Blacks da Apolo Distribuidora">
<div class="timer" role="timer" aria-live="off"><div class="timer-title">PROMOÇÃO TERMINA ÀS 17H</div><div class="units" id="units">
<div class="unit"><div class="value" id="days">00</div><div class="label">DIAS</div></div><div class="unit"><div class="value" id="hours">00</div><div class="label">HRS</div></div><div class="unit"><div class="value" id="minutes">00</div><div class="label">MIN</div></div><div class="unit"><div class="value" id="seconds">00</div><div class="label">SEG</div></div></div><div class="expired" id="expired" hidden>PROMOÇÃO ENCERRADA</div></div>
</section></main>
<script>
// Ajuste a data abaixo para o encerramento real. Formato: AAAA-MM-DDTHH:MM:SS-03:00
const END_DATE = '2026-11-17T17:00:00-03:00';
const end = new Date(END_DATE).getTime();
const pad = n => String(n).padStart(2,'0');
function update(){const left=end-Date.now();if(left<=0){document.getElementById('units').hidden=true;document.getElementById('expired').hidden=false;return;}const d=Math.floor(left/86400000),h=Math.floor(left%86400000/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);document.getElementById('days').textContent=pad(d);document.getElementById('hours').textContent=pad(h);document.getElementById('minutes').textContent=pad(m);document.getElementById('seconds').textContent=pad(s);}
update();setInterval(update,1000);
</script>
</body>
</html>
