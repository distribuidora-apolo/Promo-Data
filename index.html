<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090606">
  <meta name="description" content="Contagem regressiva em tempo real para a Black das Blacks da Apolo Distribuidora.">
  <title>Black das Blacks | Apolo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #090606; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 18px;
      color: #fff; font-family: Arial, Helvetica, sans-serif;
    }
    .stage { position: relative; width: min(100%, 900px); aspect-ratio: 1; overflow: hidden; }
    .art { display: block; width: 100%; height: 100%; object-fit: contain; }
    .timer {
      position: absolute; left: 50%; bottom: 4.9%; transform: translateX(-50%);
      width: 58%; height: 9.2%; min-height: 58px; max-height: 96px;
      display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
      padding: 3px 2.2%; border: 2px solid #ff3a16; border-radius: 999px;
      background: linear-gradient(180deg, rgba(12,7,7,.98), rgba(21,4,3,.98));
      box-shadow: 0 0 9px #ff371c, 0 0 24px rgba(255,65,12,.48), inset 0 0 12px rgba(255,56,14,.22);
    }
    .unit { position: relative; display: flex; height: 100%; flex-direction: column; justify-content: center; align-items: center; line-height: 1; }
    .unit + .unit::before { content: ""; position: absolute; left: 0; height: 68%; width: 1px; top: 16%; background: #ff4b23; box-shadow: 0 0 5px #ff4b23; }
    .value { font-size: clamp(19px, 5.15vw, 54px); font-weight: 900; letter-spacing: .01em; color: #fff; text-shadow: 0 0 5px #ff5131, 0 0 13px #fa2b10; font-variant-numeric: tabular-nums; }
    .label { margin-top: 4px; font-size: clamp(7px, 1.5vw, 13px); font-weight: 800; letter-spacing: .07em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (min-width: 700px) { body { padding: 24px; } }
    @media (max-width: 420px) {
      body { padding: 0; }
      .stage { width: 100vw; }
      .timer { min-height: 50px; border-width: 1px; }
      .value { font-size: clamp(18px, 5.1vw, 22px); }
    }
  </style>

    <section class="timer" role="timer" aria-label="Contagem regressiva até terça-feira, 17 de novembro, à meia-noite, horário de Brasília">
      <div class="unit"><span class="value" id="days">00</span><span class="label">DIAS</span></div>
      <div class="unit"><span class="value" id="hours">00</span><span class="label">HRS</span></div>
      <div class="unit"><span class="value" id="minutes">00</span><span class="label">MIN</span></div>
      <div class="unit"><span class="value" id="seconds">00</span><span class="label">SEG</span></div>
    </section>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>
  <script>
    // Zera terça-feira, 17/11/2026 às 00:00 no horário de Brasília (UTC-3).
    const deadline = new Date('2026-11-17T03:00:00Z').getTime();
    const fields = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };
    const two = value => String(value).padStart(2, '0');
    function updateCountdown() {
      const remaining = Math.max(0, deadline - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      fields.days.textContent = two(Math.floor(totalSeconds / 86400));
      fields.hours.textContent = two(Math.floor((totalSeconds % 86400) / 3600));
      fields.minutes.textContent = two(Math.floor((totalSeconds % 3600) / 60));
      fields.seconds.textContent = two(totalSeconds % 60);
      if (remaining === 0) document.getElementById('status').textContent = 'A campanha começou.';
    }
    updateCountdown();
    setInterval(updateCountdown, 250);
  </script>
