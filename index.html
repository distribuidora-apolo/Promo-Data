<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080706">
  <title>A Última Black de Novembro | Apolo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080706; }
    body { display: grid; place-items: center; color: white; font-family: Arial, Helvetica, sans-serif; }
    .campaign { width: min(100vw, 100vh, 900px); aspect-ratio: 1; position: relative; overflow: hidden; background: #080706 url("A%20%C3%BAltima%20Black%3A%20contagem%20regressiva.png") center / 100% 100% no-repeat; }
    /* A arte já contém o contador visual. Esta camada ocupa apenas a área vazia abaixo dela. */
    .live-countdown { position: absolute; left: 8%; right: 8%; top: 88.4%; height: 9%; display: flex; align-items: center; justify-content: center; gap: clamp(5px, 1.5vw, 18px); color: #fff; text-shadow: 0 2px 8px #000, 0 0 12px #d79a27; }
    .unit { min-width: 11%; text-align: center; }
    .value { display: block; font-size: clamp(19px, 5.2vw, 48px); line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
    .label { display: block; margin-top: 4px; font-size: clamp(7px, 1.35vw, 12px); line-height: 1; font-weight: 700; letter-spacing: .08em; }
    .sep { align-self: center; margin-top: -13px; font-size: clamp(18px, 3vw, 28px); font-weight: 900; color: #ffd66a; }
    .screen-reader { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (min-width: 901px) { .campaign { width: min(100vw, 100vh, 900px); } }
  </style>
</head>
<body>
  <main class="campaign" aria-label="A Última Black de Novembro começa quarta-feira">
    <section class="live-countdown" aria-label="Contagem regressiva até o início da promoção">
      <h1 class="screen-reader">A Última Black de Novembro começa quarta-feira</h1>
      <div class="unit"><span class="value" id="days">00</span><span class="label">DIAS</span></div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit"><span class="value" id="hours">00</span><span class="label">HORAS</span></div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit"><span class="value" id="minutes">00</span><span class="label">MINUTOS</span></div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit"><span class="value" id="seconds">00</span><span class="label">SEGUNDOS</span></div>
    </section>
  </main>
  <script>
    // Início na próxima quarta-feira, à meia-noite, no fuso de São Paulo.
    // O evento desta campanha é quarta-feira, 25/11/2026.
    const target = new Date('2026-11-25T00:00:00-03:00');
    const elements = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };
    const pad = n => String(n).padStart(2, '0');
    function updateCountdown() {
      let remaining = Math.max(0, target.getTime() - Date.now());
      const day = 86400000, hour = 3600000, minute = 60000;
      const d = Math.floor(remaining / day); remaining %= day;
      const h = Math.floor(remaining / hour); remaining %= hour;
      const m = Math.floor(remaining / minute); remaining %= minute;
      const s = Math.floor(remaining / 1000);
      elements.days.textContent = pad(d);
      elements.hours.textContent = pad(h);
      elements.minutes.textContent = pad(m);
      elements.seconds.textContent = pad(s);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
